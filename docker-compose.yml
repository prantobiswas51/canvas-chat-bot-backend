services:
  postgres:
    image: postgres:16-alpine
    container_name: canvas-chat-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas}
      POSTGRES_DB: ${POSTGRES_DB:-canvas_chat_bot}
    ports:
      - '${POSTGRES_PORT:-5532}:5432'
    volumes:
      - canvas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-canvas} -d ${POSTGRES_DB:-canvas_chat_bot}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  canvas_pg_data:
